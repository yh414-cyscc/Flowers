<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>yh414 Flowers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
      touch-action: none;
      font-family: serif;
    }

    canvas {
      display: block;
    }

    .center-text {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 28px;
      letter-spacing: 1px;
      opacity: 0.85;
      pointer-events: none;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="center-text">Click to have a flower</div>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const flowers = [];

function randomColor() {
  const colors = [
    ["#ff5fa2", "#ff9ad5"],
    ["#ff6b6b", "#ffa07a"],
    ["#c77dff", "#f3c4fb"],
    ["#ff8fab", "#ffd6e0"]
  ];
  return colors[Math.floor(Math.random() * colors.length)];
}

function addFlower(x) {
  const [c1, c2] = randomColor();
  flowers.push({
    x,
    y: canvas.height,
    height: 0,
    maxHeight: 120 + Math.random() * 120,
    growSpeed: 1.5 + Math.random(),
    sway: Math.random() * 2,
    color1: c1,
    color2: c2
  });
}

function drawFlower(f) {
  // stem
  ctx.beginPath();
  ctx.strokeStyle = "#3cff6a";
  ctx.lineWidth = 2;
  ctx.moveTo(f.x, canvas.height);
  ctx.quadraticCurveTo(
    f.x + f.sway * 10,
    canvas.height - f.height / 2,
    f.x,
    canvas.height - f.height
  );
  ctx.stroke();

  // petals
  const flowerY = canvas.height - f.height;
  ctx.save();
  ctx.translate(f.x, flowerY);

  for (let i = 0; i < 6; i++) {
    ctx.rotate(Math.PI / 3);
    ctx.beginPath();
    ctx.fillStyle = i % 2 ? f.color1 : f.color2;
    ctx.ellipse(0, -10, 10, 22, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // center
  ctx.beginPath();
  ctx.fillStyle = "#ffd166";
  ctx.arc(0, 0, 5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (const f of flowers) {
    if (f.height < f.maxHeight) {
      f.height += f.growSpeed;
    }
    drawFlower(f);
  }

  requestAnimationFrame(animate);
}
animate();

// touch
canvas.addEventListener("touchstart", e => {
  const t = e.touches[0];
  addFlower(t.clientX);
});

// mouse
canvas.addEventListener("mousedown", e => {
  addFlower(e.clientX);
});
</script>

</body>
</html>
