<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>yh414 – Touch Flowers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0f0f0f;
      overflow: hidden;
      touch-action: none;
      font-family: Arial, Tahoma, sans-serif;
    }

    canvas {
      display: block;
    }

    .label {
      position: fixed;
      top: 10px;
      right: 15px;
      color: #fff;
      font-size: 14px;
      opacity: 0.7;
      z-index: 10;
    }
  </style>
</head>
<body>

<div class="label">yh414 🌸</div>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas')
const ctx = canvas.getContext('2d')

function resize() {
  canvas.width = window.innerWidth
  canvas.height = window.innerHeight
}
resize()
window.addEventListener('resize', resize)

function drawFlower(x, y) {
  const petals = 10
  const petalRadius = 16
  const centerRadius = 6

  ctx.save()
  ctx.translate(x, y)

  for (let i = 0; i < petals; i++) {
    ctx.rotate((Math.PI * 2) / petals)
    ctx.beginPath()
    ctx.fillStyle = `hsl(${Math.random() * 360}, 80%, 65%)`
    ctx.arc(14, 0, petalRadius, 0, Math.PI * 2)
    ctx.fill()
  }

  ctx.beginPath()
  ctx.fillStyle = '#FFD700'
  ctx.arc(0, 0, centerRadius, 0, Math.PI * 2)
  ctx.fill()

  ctx.restore()

  drawArabicText('مرحبا', x, y - 22)
}

function drawArabicText(text, x, y) {
  ctx.save()
  ctx.font = '18px Tahoma'
  ctx.fillStyle = '#ffffff'
  ctx.textAlign = 'right'
  ctx.direction = 'rtl'
  ctx.fillText(text, x, y)
  ctx.restore()
}

/* Touch events (mobile) */
canvas.addEventListener('touchstart', e => {
  e.preventDefault()
  const t = e.touches[0]
  drawFlower(t.clientX, t.clientY)
})

canvas.addEventListener('touchmove', e => {
  e.preventDefault()
  const t = e.touches[0]
  drawFlower(t.clientX, t.clientY)
})

/* Mouse events (desktop) */
let mouseDown = false

canvas.addEventListener('mousedown', e => {
  mouseDown = true
  drawFlower(e.clientX, e.clientY)
})

canvas.addEventListener('mousemove', e => {
  if (!mouseDown) return
  drawFlower(e.clientX, e.clientY)
})

canvas.addEventListener('mouseup', () => {
  mouseDown = false
})
</script>

</body>
</html>
